#============================================================
#OFFLINE DECAY | OPTIONAL LOSS OF NORMAL ANCHORS
#============================================================
#Disabled by default. Applies at login after the grace period.
#Does not remove consenting followers, NPC links, or other unique sources.
#This is separate from the fixed 20% normal-anchor death penalty.
[offline_decay]
	#Enable loss of normal anchors during extended offline periods.
	enabled = false
	#Real-world hours offline before decay starts. 72 = three days.
	# Default: 72
	# Range: > 0
	grace_hours = 72
	#Percentage of remaining normal anchors lost per 24 hours of eligible absence.
	#2.0 means 2%, not a fraction. Loss is compounded and scaled to interval_hours.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	percent_per_day = 2.0
	#Apply decay only for complete intervals after the grace period, in real-world hours.
	#24 = daily; 12 = twice daily at the equivalent daily percentage.
	# Default: 24
	# Range: > 1
	interval_hours = 24

#============================================================
#SANITY | OPTIONAL INTEGRATION WITH LOTMCRAFT
#============================================================
#Disabled by default. Applies only to living survival/adventure players at Sequences 3 to 0.
#Uses the requirement for the CURRENT Sequence, not the next advancement.
#Deficit = 1 - total anchors / current requirement, limited to 0..1.
#Sanity ceiling = native effective maximum * (1 - max_penalty * deficit).
#Sanity above this ceiling falls gradually. Sanity below it is never increased by the addon.
#Sufficient anchors release the ceiling; other native sanity losses and recovery still apply.
#This uses native setSanityAndSync, not an attack: Persona blocking and native damage multipliers are not applied again.
#NPC unloading can reduce anchors; choose a grace period and source balance appropriate for your server.
[anchor_sanity]
	#Enable anchor-based sanity pressure. Turn on after reviewing the values below.
	enabled = false
	#Server simulation seconds between checks. No pressure is applied while offline.
	# Default: 5
	# Range: 1 ~ 60
	check_interval_seconds = 5
	#Server simulation seconds of grace after login, respawn, or a change of Sequence.
	# Default: 120
	# Range: 0 ~ 3600
	grace_seconds = 120
	#Additional simulation seconds of continuous anchor deficit before pressure starts.
	#Reset when anchors become sufficient. Helps tolerate short NPC/chunk-loading interruptions.
	# Default: 30
	# Range: 0 ~ 3600
	deficit_grace_seconds = 30
	#Maximum reduction per simulation second, as a fraction of the native effective sanity maximum.
	#0.005 = 0.5 percentage points per second. Applied at each check; this is not the target ceiling.
	# Default: 0.005
	# Range: 0.0 ~ 1.0
	max_drop_per_second = 0.005
	#Notify once when anchor pressure starts; notify again after recovery or a Sequence change.
	announce_pressure = true

	#Maximum reduction of the native sanity maximum when the player has zero anchors.
	#Fractions, not percentages. 0.65 means a 65% reduction, leaving a 35% ceiling.
	#Actual pressure scales with the deficit. 0 disables pressure at that Sequence.
	[anchor_sanity.max_penalty]
		# Default: 0.65
		# Range: 0.0 ~ 1.0
		sequence_0 = 0.65
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		sequence_1 = 0.5
		# Default: 0.3
		# Range: 0.0 ~ 1.0
		sequence_2 = 0.3
		# Default: 0.15
		# Range: 0.0 ~ 1.0
		sequence_3 = 0.15
