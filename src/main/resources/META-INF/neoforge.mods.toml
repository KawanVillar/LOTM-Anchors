type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lotmcraft"
type="required"
versionRange="[${lotm_version},)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="lotm_anchors.mixins.json"
