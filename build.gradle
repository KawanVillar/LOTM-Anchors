plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.163'
    id 'net.neoforged.gradle.mixin' version '7.0.163'
}

group = mod_group_id
version = mod_version

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

runs {
    configureEach {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.main
    }
    client { }
    server { argument '--nogui' }
    gameTestServer { }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

mixin {
    configs.add("${mod_id}.mixins.json")
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation files("${rootDir}/libs/lotmcraft-${lotm_version}.jar")
}

def validateLotmDependency = tasks.register('validateLotmDependency') {
    def lotmJar = layout.projectDirectory.file("libs/lotmcraft-${lotm_version}.jar")
    inputs.file(lotmJar)
    doLast {
        def archive = new java.util.zip.ZipFile(lotmJar.asFile)
        try {
            if (archive.getEntry('de/jakob/lotm/util/BeyonderData.class') == null) {
                def classCount = archive.stream().filter { entry -> entry.name.endsWith('.class') }.count()
                throw new GradleException("LOTMCraft ${lotm_version}: BeyonderData.class missing from ${lotmJar.asFile}. Java classes in JAR: ${classCount}. Replace it with the complete mod JAR for the version configured in lotm_version.")
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('compileJava') { dependsOn validateLotmDependency }
tasks.named('processResources') { dependsOn validateLotmDependency }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        lotm_version: lotm_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('testTeamAnchorRules', JavaExec) {
    group = 'verification'
    description = 'Checks Team anchor validation without launching Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = files(sourceSets.main.output.classesDirs, sourceSets.test.output.classesDirs)
    mainClass = 'com.kawan.lotmanchors.anchor.TeamAnchorRulesTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('testTeamAnchorRules') }

